<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Datenschutzerklärungen</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
            line-height: 1.7;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 16px;
            background: linear-gradient(90deg, #4CAF50, #81C784);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #ccc;
            margin-bottom: 20px;
        }

        ul {
            padding-left: 25px;
        }

        li {
            margin-bottom: 8px;
        }

        a {
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Datenschutzerklärungen</h1>
        <p>Übersicht der Datenschutzerklärungen meiner Apps. Jede App liegt in einem eigenen Ordner, damit spätere Apps hier ergänzt werden können.</p>
        <ul>
            <li><a href="equirythm/">EquiRythm</a></li>
        </ul>
    </div>
</body>
</html>
